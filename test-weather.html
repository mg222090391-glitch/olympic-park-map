<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>weather.js 혼자 테스트하기</title>
  <style>
    body { font-family: sans-serif; max-width: 720px; margin: 24px auto; padding: 0 16px; line-height: 1.6; }
    label { display: inline-block; margin-right: 12px; }
    pre { background: #f4f4f4; padding: 12px; border-radius: 8px; white-space: pre-wrap; }
    .note { color: #666; font-size: 14px; }
  </style>
</head>
<body>
  <h1>weather.js 테스트</h1>
  <p class="note">팀원2 혼자 테스트하는 페이지예요. GitHub 저장소에는 올리지 않아요.<br>
    주소 뒤에 <code>?weather=sample</code>을 붙이면 샘플 날씨로 테스트해요.</p>

  <h2>사용자 상황 고르기</h2>
  <div id="profiles">
    <label><input type="checkbox" value="wheelchair"> 휠체어</label>
    <label><input type="checkbox" value="stroller"> 유아차</label>
    <label><input type="checkbox" value="elderly"> 오래 못 걷는 동행</label>
    <label><input type="checkbox" value="pregnant"> 임산부</label>
    <label><input type="checkbox" value="concert"> 공연 대기</label>
  </div>

  <h2>conditionready 받은 횟수: <span id="count">0</span></h2>
  <pre id="output">아직 받은 정보가 없어요.</pre>

  <script>
    // ui.js 대신 만드는 임시 appState (팀 약속 7번 형식)
    window.appState = {
      profiles: [],
      filters: { diaper: false, bell: false, openNow: false, femaleStalls: false },
      userLocation: null
    };

    // ui.js 대신 profilechange 보내기
    document.querySelectorAll("#profiles input").forEach(function (box) {
      box.addEventListener("change", function () {
        window.appState.profiles = Array.from(document.querySelectorAll("#profiles input:checked"))
          .map(function (b) { return b.value; });
        document.dispatchEvent(new Event("profilechange"));
      });
    });

    // ui.js 대신 conditionready 받기
    let count = 0;
    document.addEventListener("conditionready", function () {
      count++;
      document.getElementById("count").textContent = count;
      document.getElementById("output").textContent = JSON.stringify(window.conditionInfo, null, 2);
    });
  </script>
  <script src="weather.js"></script>
</body>
</html>
